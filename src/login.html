<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — GuguDex</title>
  <link rel="icon" href="assets/img/logo-gengar.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth auth--login">
    <div class="auth__fundo" aria-hidden="true"></div>

    <section class="auth__painel" aria-labelledby="titulo">
      <h1 class="p t t--centro" id="titulo" style="--y:104.6;--s:92">Login</h1>

      <form id="form-login" novalidate>
        <p class="auth__erro-geral" id="erro-geral" role="alert"></p>

        <div class="campo auth__campo p pw" style="--x:50;--y:281;--w:550;--h:80;--ix:20;--iy:13;--is:55;--pl:80">
          <img src="assets/img/icone-usuario.png" alt="">
          <label class="sr-only" for="identificador">Nome de usuário ou e-mail</label>
          <input id="identificador" type="text" name="identificador" placeholder="Nome de usuário" autocomplete="username" required aria-describedby="erro-identificador">
          <span class="campo__erro" id="erro-identificador"></span>
        </div>

        <div class="campo auth__campo p pw" style="--x:50;--y:376;--w:550;--h:80;--ix:26;--iy:19;--is:42;--pl:79">
          <img src="assets/img/icone-cadeado.png" alt="">
          <label class="sr-only" for="senha">Senha</label>
          <input id="senha" type="password" name="senha" placeholder="Senha" autocomplete="current-password" required aria-describedby="erro-senha">
          <span class="campo__erro" id="erro-senha"></span>
        </div>

        <label class="auth__check auth__check--sombra t--sombra" style="--x:50;--y:481;--cb:30;--tx:16.6;--ty:1.9">
          <input type="checkbox" name="lembrar"><span>Lembrar de mim</span>
        </label>
        <button type="button" class="auth__link p t t--sombra" id="esqueceu" style="--x:416.4;--y:482.5">Esqueceu a senha?</button>

        <button class="auth__enviar p pw" type="submit" style="--x:168;--y:532;--w:314;--h:62">Entrar</button>
      </form>

      <p class="p t t--centro" style="--y:606">Ou entre com:</p>
      <div id="sociais">
        <button class="auth__social p pw" type="button" data-rede="Facebook" aria-label="Entrar com Facebook" style="--x:120;--y:653;--w:70;--h:70"><img src="assets/img/social-facebook.png" alt="" style="--ix:5;--iy:6;--iw:60;--ih:57"></button>
        <button class="auth__social p pw" type="button" data-rede="Google" aria-label="Entrar com Google" style="--x:290;--y:653;--w:70;--h:70"><img src="assets/img/social-google.png" alt="" style="--ix:-2;--iy:1;--iw:68;--ih:67"></button>
        <button class="auth__social p pw" type="button" data-rede="Discord" aria-label="Entrar com Discord" style="--x:460;--y:653;--w:70;--h:70"><img src="assets/img/social-discord.png" alt="" style="--ix:1;--iy:5;--iw:66;--ih:60"></button>
      </div>

      <p class="auth__rodape p t t--centro t--sombra" style="--y:742.1">Não tem conta? <a href="registro.html">Registre-se</a></p>
    </section>
  </main>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
