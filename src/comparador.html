<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comparador — GuguDex</title>
  <meta name="description" content="Compare os atributos de batalha de dois Pokémon lado a lado.">
  <link rel="icon" href="assets/img/logo-gengar.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/comparador.css">
</head>
<body>
  <header id="site-header"></header>


  <main>
    <h1 class="sr-only">Comparador de Pokémon</h1>


    <section class="cmp-arena" aria-label="Escolha os Pokémon">
      <div class="container">
        <div class="cmp-lados" id="lados"></div>
      </div>
    </section>


    <section class="cmp-resultado" aria-labelledby="titulo-cmp">
      <div class="container">
        <h2 class="cmp-resultado__titulo" id="titulo-cmp">Comparação de Atributos de Batalha</h2>
        <p class="cmp-resumo" id="resumo" role="status" aria-live="polite"></p>
        <div class="cmp-paineis" id="paineis"></div>
        <div class="cmp-acoes" id="acoes"></div>
      </div>
    </section>
  </main>


  <footer id="site-footer"></footer>
  <script type="module" src="js/pages/comparador.js"></script>
</body>
</html>
